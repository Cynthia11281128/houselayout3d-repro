schema_version: 1
scene: r04_front

input:
  images: /home/xinyuan/GRIP-Layout/data/r04/feed_forward/keyframes_all3/front
  poses_csv: /home/xinyuan/GRIP-Layout/data/r04/feed_forward/keyframes_all3/front/poses.csv
  pose_convention: opencv_c2w_xyzw_meters
  image_glob: "*.png"
  filename_regex: '^(?P<sec>[0-9]{10})_(?P<nsec>[0-9]{9})\.png$'
  require_strict_timestamp_order: true
  camera:
    model: PINHOLE
    width: 800
    height: 600
    fx: 463.99945
    fy: 463.25045
    cx: 400.0
    cy: 300.0

storage:
  data: /tmp/tmp_data/GRIP-Layout/baselines/HouseLayout3D/data
  weights: /tmp/tmp_data/GRIP-Layout/baselines/HouseLayout3D/weights
  outputs: /tmp/tmp_data/GRIP-Layout/baselines/HouseLayout3D/outputs
  cache: /tmp/tmp_data/GRIP-Layout/baselines/HouseLayout3D/cache

metric3d:
  repository: /home/xinyuan/GRIP-Layout/baselines/HouseLayout3D/external/Metric3D
  weights: /tmp/tmp_data/GRIP-Layout/baselines/HouseLayout3D/weights/Metric3D/metric_depth_vit_large_800k.pth
  model: metric3d_vit_large
  input_height: 616
  input_width: 1064
  canonical_focal_length: 1000.0
  minimum_depth_meters: 0.0
  maximum_depth_meters: 300.0

dn_splatter:
  method: dn-splatter
  max_num_iterations: 30000
  steps_per_save: 5000
  depth_loss_type: EdgeAwareLogL1
  depth_lambda: 0.2
  normal_supervision: depth
  seed_stride: 8
  seed_minimum_depth_meters: 0.1
  seed_maximum_depth_meters: 30.0
  seed_voxel_size_meters: 0.03
  maximum_seed_points: 500000

mesh:
  exporter: dn
  total_points: 2000000
  normal_method: normal_maps
  use_masks: true
  filter_edges_from_depth_maps: false
  poisson_depth: 9

oneformer:
  model_dir: /tmp/tmp_data/GRIP-Layout/baselines/HouseLayout3D/weights/OneFormer/oneformer_coco_swin_large
  task: semantic
  preview_count: 24

skeleton:
  render_executable: /tmp/tmp_data/miniconda3/envs/nerfstudio/bin/ns-render
  superpoint_repository: /home/xinyuan/GRIP-Layout/baselines/HouseLayout3D/external/superpoint-transformer
  samples_per_frame: 5000
  knn_neighbors: 45
  knn_radius_meters: 2.0
  adjacency_neighbors: 10
  adjacency_weight: 1.0
  regularization: [0.01, 0.1, 0.5]
  spatial_weight: [0.1, 0.1, 0.1]
  cutoff: [10, 10, 10]
  iterations: 15
  final_level: 3

polygon_init:
  superpoint_level: 3
  minimum_unassigned_vertices: 100
  plane_distance_threshold_meters: 0.05
  ransac_iterations: 256
  rdp_epsilon_meters: 0.03

prototype:
  python_executable: /tmp/tmp_data/miniconda3/envs/houselayout3d-layout/bin/python
  source_repository: /home/xinyuan/GRIP-Layout/baselines/HouseLayout3D/external/MultiFloor3D-unofficial
  scene_type: matterport
  iterations: 4000
  checkpoint_interval: 100
  object_target_triangles: 50000

scene_graph:
  openseg_python: /tmp/tmp_data/miniconda3/envs/houselayout3d-openseg/bin/python
  openseg_model: /tmp/tmp_data/GRIP-Layout/baselines/HouseLayout3D/weights/OpenSeg/exported_model
  clip_weights: /tmp/tmp_data/GRIP-Layout/baselines/HouseLayout3D/weights/OpenAI-CLIP/ViT-L-14-336px.pt
  grid_resolution_meters: 0.05
  floor_merge_height_meters: 0.5
  ceiling_minimum_clearance_meters: 1.0
  wall_interval_height_meters: 2.5
  wall_line_width_meters: 0.08
  bottleneck_widths_meters: [2.5, 1.5]
  door_maximum_width_meters: 1.5
  minimum_seed_area_square_meters: 0.02
  minimum_room_area_square_meters: 0.5
  visibility_tolerance_meters: 0.25
  image_boundary_pixels: 10
  frame_stride: 1
  stair_room_maximum_distance_meters: 0.5
  stair_minimum_triangles: 3

layout:
  door_height_meters: 2.1
  maximum_ceilings_per_room: 30
  window_minimum_cluster_points: 10
  window_minimum_size_meters: 0.3
  window_dbscan_epsilon_meters: 0.15
  window_dbscan_minimum_samples: 5
  window_outlier_neighbors: 20
  window_voxel_size_meters: 0.03
  window_frame_stride: 1
  window_pixel_stride: 1
  window_maximum_ray_distance_meters: 30.0
  stair_step_height_meters: 0.18

runtime:
  random_seed: 0
  preferred_gpu: 1
  colmap_executable: /home/xinyuan/.local/bin/colmap
  colmap_matcher: sequential
  colmap_sequential_overlap: 10
  minimum_registered_image_ratio: 0.80
  canonical_up_axis: Z
