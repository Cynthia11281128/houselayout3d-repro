[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "houselayout3d-reproduction"
version = "0.1.0"
description = "Independent reproduction of the HouseLayout3D MultiFloor3D pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "PyYAML>=6.0,<7",
  "scipy>=1.10,<2",
  "open3d>=0.18,<0.20",
  "opencv-python>=4.8,<5",
  "scikit-image>=0.22,<0.26",
  "shapely>=2.0,<3",
  "triangle>=20250106,<20260101",
]

[project.scripts]
houselayout3d = "houselayout3d.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
